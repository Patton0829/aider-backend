[project]
name = "aider-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the control-center aider agent and live job logs."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.68,<3.0",
  "pexpect>=4.9,<5.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
]
